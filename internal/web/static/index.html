<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>locklyctl-mqtt console</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#1a1a1a; --muted:#666; --line:#ddd; --accent:#2b6cb0; --ok:#2f855a; --off:#c05621; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16181d; --fg:#e8e8e8; --muted:#9aa0a6; --line:#2d313a; --accent:#63b3ed; --ok:#68d391; --off:#f6ad55; } }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .sp { flex:1; }
  main { max-width:1000px; margin:0 auto; padding:16px; }
  .cols { display:grid; grid-template-columns:1fr 1.4fr; gap:16px; }
  @media (max-width:760px) { .cols { grid-template-columns:1fr; } }
  .card { border:1px solid var(--line); border-radius:8px; padding:14px; margin-bottom:16px; }
  .card h2 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:0 0 10px; }
  table { width:100%; border-collapse:collapse; }
  td,th { text-align:left; padding:6px 4px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { color:var(--muted); font-weight:500; font-size:12px; }
  button { font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:transparent; color:var(--fg); cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:transparent; }
  button:hover { border-color:var(--accent); }
  input,select { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); width:100%; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:end; margin-top:8px; }
  .row > label { flex:1; min-width:90px; font-size:12px; color:var(--muted); }
  .pill { font-size:12px; padding:2px 8px; border-radius:99px; border:1px solid var(--line); }
  .on { color:var(--ok); } .offline { color:var(--off); }
  .clickable { cursor:pointer; } .clickable:hover { color:var(--accent); }
  .msg { font-size:13px; color:var(--muted); min-height:18px; }
  .err { color:var(--off); }
  .hidden { display:none; }
  .sub { font-size:12px; color:var(--muted); }
  .cardhead { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .cardhead h2 { margin:0; }
  .cardhead .sp { flex:1; }
  button.small { padding:3px 8px; font-size:12px; }
  button:disabled { opacity:.35; cursor:default; border-color:var(--line); }
  .acts { text-align:right; white-space:nowrap; }
  .acts button { padding:2px 7px; }
  tr.dim td { opacity:.55; }
</style>
</head>
<body>
<header>
  <h1>locklyctl-mqtt</h1><span class="sub" id="whoami"></span>
  <span class="sp"></span>
  <button id="logout" class="hidden">Sign out</button>
</header>
<main>
  <section id="loginView" class="card" style="max-width:340px;margin:40px auto;">
    <h2>Operator sign in</h2>
    <div class="row"><label>Username<input id="luser" autocomplete="username"></label></div>
    <div class="row"><label>Password<input id="lpass" type="password" autocomplete="current-password"></label></div>
    <div class="row"><button class="primary" id="loginBtn">Sign in</button></div>
    <div class="msg err" id="loginMsg"></div>
  </section>

  <div id="appView" class="hidden">
    <div class="cols">
      <div>
        <div class="card">
          <div class="cardhead"><h2>Locks</h2><span class="sp"></span><button id="hiddenToggle" class="small hidden">Show hidden</button></div>
          <table><tbody id="locks"></tbody></table>
          <div class="msg" id="locksMsg"></div>
        </div>
        <div class="card">
          <h2>Accounts</h2>
          <table><tbody id="accounts"></tbody></table>
          <div class="row">
            <label>Email<input id="aEmail"></label>
            <label>Password<input id="aPass" type="password"></label>
            <button id="aAdd">Add</button>
          </div>
          <div class="msg" id="accMsg"></div>
        </div>
      </div>
      <div>
        <div class="card" id="lockCard">
          <h2 id="lockTitle">Select a lock</h2>
          <div class="msg" id="lockDetail"></div>
          <table><thead><tr><th>Person</th><th>Type</th><th>State</th><th></th></tr></thead><tbody id="people"></tbody></table>
          <div id="addPerson" class="hidden">
            <div class="row">
              <label>Name<input id="pName"></label>
              <label>Slot<input id="pPwd" type="number" value="0"></label>
              <label>User id<input id="pUid" type="number" value="0"></label>
            </div>
            <div class="row">
              <label>PIN<input id="pPin"></label>
              <label>Type<select id="pType"><option value="34">Family</option><option value="18">Guest (window)</option><option value="66">Guest (weekly)</option></select></label>
              <button id="pAdd">Add person</button>
            </div>
            <div class="msg" id="pMsg"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
<script>
const $ = s => document.querySelector(s);
let token = localStorage.getItem("op_token") || "";
let currentLock = null;
let accountsById = {};
let showHidden = false;
try { showHidden = localStorage.getItem("show_hidden") === "1"; } catch (_) {}

async function api(method, path, body) {
  const opt = { method, headers: {} };
  if (token) opt.headers["Authorization"] = "Bearer " + token;
  if (body !== undefined) { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const res = await fetch(path, opt);
  const txt = await res.text();
  let data = {}; try { data = txt ? JSON.parse(txt) : {}; } catch (_) {}
  if (!res.ok) throw new Error(data.error || data.msg || ("HTTP " + res.status));
  return data;
}

function show(authed) {
  $("#loginView").classList.toggle("hidden", authed);
  $("#appView").classList.toggle("hidden", !authed);
  $("#logout").classList.toggle("hidden", !authed);
}

async function login() {
  $("#loginMsg").textContent = "";
  try {
    const d = await api("POST", "/admin/api/login", { username: $("#luser").value, password: $("#lpass").value });
    token = d.token; localStorage.setItem("op_token", token);
    $("#whoami").textContent = d.username || "";
    show(true); await refresh();
  } catch (e) { $("#loginMsg").textContent = e.message; }
}

function logout() { token = ""; localStorage.removeItem("op_token"); currentLock = null; show(false); }

// Accounts first, so the lock list can label each account's group.
async function refresh() { await loadAccounts(); await loadLocks(); }

// The list is ordered by account, then each account's own order. Hidden locks
// are left out unless "Show hidden" is on; then they appear dimmed with an
// Unhide button, so a hidden lock can always be brought back from here.
async function loadLocks() {
  const d = await api("GET", "/admin/api/locks");
  const all = d.locks || [];
  const hiddenCount = all.filter(l => l.hidden).length;
  const tog = $("#hiddenToggle");
  tog.textContent = (showHidden ? "Hide hidden" : "Show hidden") + ` (${hiddenCount})`;
  tog.classList.toggle("hidden", hiddenCount === 0 && !showHidden);

  const byAcct = new Map();
  all.forEach(l => { if (!byAcct.has(l.ownerAccountId)) byAcct.set(l.ownerAccountId, []); byAcct.get(l.ownerAccountId).push(l); });
  const multi = byAcct.size > 1;
  $("#locks").innerHTML = "";
  byAcct.forEach((locks, acct) => {
    const visible = locks.filter(l => showHidden || !l.hidden);
    if (multi && visible.length) {
      const g = document.createElement("tr");
      g.innerHTML = `<td colspan="4" class="sub">${esc((accountsById[acct] || {}).email || ("account " + acct))}</td>`;
      $("#locks").appendChild(g);
    }
    visible.forEach((l, i) => {
      const tr = document.createElement("tr");
      if (l.hidden) tr.className = "dim";
      const name = l.blename || l.deviceId || ("lock " + l.id);
      tr.innerHTML = `<td class="clickable">${esc(name)}${l.hidden ? ' <span class="pill">hidden</span>' : ""}</td>
        <td class="sub">${esc(l.model || "")}</td>
        <td class="${l.online ? "on" : "offline"}">${l.online ? "online" : "offline"}</td>
        <td class="acts"><button data-up title="Move up"${i === 0 ? " disabled" : ""}>&uarr;</button>
          <button data-down title="Move down"${i === visible.length - 1 ? " disabled" : ""}>&darr;</button>
          <button data-h>${l.hidden ? "Unhide" : "Hide"}</button></td>`;
      tr.querySelector(".clickable").onclick = () => selectLock(l);
      tr.querySelector("[data-up]").onclick = () => move(locks, visible, i, -1);
      tr.querySelector("[data-down]").onclick = () => move(locks, visible, i, 1);
      tr.querySelector("[data-h]").onclick = () => setHidden(l, !l.hidden);
      $("#locks").appendChild(tr);
    });
  });
  const shown = all.filter(l => showHidden || !l.hidden).length;
  $("#locksMsg").textContent = all.length && !shown
    ? "Every lock is hidden. Use \"Show hidden\" to bring them back." : "";
}

async function setHidden(l, hidden) {
  try { await api("POST", "/admin/api/locks/" + l.id + "/hidden", { hidden }); $("#locksMsg").textContent = ""; }
  catch (e) { $("#locksMsg").textContent = e.message; }
  await loadLocks();
}

// Move a lock past exactly one visible neighbour, keeping hidden locks where
// they are in the account's full order.
async function move(locks, visible, i, dir) {
  const target = visible[i], neighbour = visible[i + dir];
  if (!neighbour) return;
  const order = locks.map(l => l.id).filter(id => id !== target.id);
  order.splice(order.indexOf(neighbour.id) + (dir > 0 ? 1 : 0), 0, target.id);
  try { await api("POST", "/admin/api/locks/order", { accountId: target.ownerAccountId, order }); $("#locksMsg").textContent = ""; }
  catch (e) { $("#locksMsg").textContent = e.message; }
  await loadLocks();
}

async function loadAccounts() {
  const d = await api("GET", "/admin/api/accounts");
  accountsById = {};
  $("#accounts").innerHTML = "";
  (d.accounts || []).forEach(a => {
    accountsById[a.id] = a;
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${esc(a.email)}</td><td style="text-align:right"><button data-id="${a.id}">Delete</button></td>`;
    // Deleting an account cascades to its locks, so reload both lists.
    tr.querySelector("button").onclick = async () => { await api("DELETE", "/admin/api/accounts/" + a.id); refresh(); };
    $("#accounts").appendChild(tr);
  });
}

async function selectLock(l) {
  currentLock = l;
  const d = await api("GET", "/admin/api/locks/" + l.id);
  $("#lockTitle").textContent = (l.blename || l.deviceId);
  $("#lockDetail").innerHTML = `<span class="pill ${d.online ? "on" : "offline"}">${d.online ? "online" : "offline"}</span> `
    + (d.state ? Object.entries(d.state).map(([k, v]) => `<span class="pill">${esc(k)}=${esc(v)}</span>`).join(" ") : "");
  $("#addPerson").classList.remove("hidden");
  await loadPeople();
}

async function loadPeople() {
  const d = await api("GET", "/admin/api/locks/" + currentLock.id + "/people");
  $("#people").innerHTML = "";
  (d.people || []).forEach(p => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${esc(p.name)}</td><td class="sub">0x${(p.userType||0).toString(16)}</td>
      <td class="${p.enabled ? "on" : "offline"}">${p.enabled ? "enabled" : "suspended"}</td>
      <td style="text-align:right"><button data-t>${p.enabled ? "Suspend" : "Enable"}</button> <button data-d>Delete</button></td>`;
    tr.querySelector("[data-t]").onclick = async () => { await toggle(p); };
    tr.querySelector("[data-d]").onclick = async () => { await api("DELETE", "/admin/api/people/" + p.id); loadPeople(); };
    $("#people").appendChild(tr);
  });
}

async function toggle(p) {
  const r = await api("POST", "/admin/api/people/" + p.id + "/enabled", { enabled: !p.enabled });
  flash("#lockDetail", r.syncDetail || "");
  loadPeople();
}

async function addPerson() {
  $("#pMsg").textContent = "";
  try {
    const r = await api("POST", "/admin/api/locks/" + currentLock.id + "/people", {
      name: $("#pName").value, pwdId: +$("#pPwd").value, userId: +$("#pUid").value,
      pin: $("#pPin").value, userType: +$("#pType").value, dateMode: "permanent", enabled: true,
    });
    $("#pMsg").textContent = r.syncDetail || "added";
    $("#pName").value = $("#pPin").value = "";
    loadPeople();
  } catch (e) { $("#pMsg").textContent = e.message; }
}

async function addAccount() {
  $("#accMsg").textContent = "";
  try {
    await api("POST", "/admin/api/accounts", { email: $("#aEmail").value, password: $("#aPass").value });
    $("#aEmail").value = $("#aPass").value = ""; loadAccounts();
  } catch (e) { $("#accMsg").textContent = e.message; }
}

function flash(sel, msg) { const el = $(sel); const old = el.innerHTML; if (msg) { el.textContent = msg; setTimeout(() => { if (currentLock) selectLock(currentLock); }, 2500); } }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

$("#loginBtn").onclick = login;
$("#logout").onclick = logout;
$("#aAdd").onclick = addAccount;
$("#pAdd").onclick = addPerson;
$("#hiddenToggle").onclick = () => {
  showHidden = !showHidden;
  try { localStorage.setItem("show_hidden", showHidden ? "1" : "0"); } catch (_) {}
  loadLocks();
};
$("#lpass").addEventListener("keydown", e => { if (e.key === "Enter") login(); });

(async () => { if (token) { try { await api("GET", "/admin/api/locks"); show(true); await refresh(); } catch (_) { logout(); } } else show(false); })();
</script>
</body>
</html>
